<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediAI - Your Intelligent Healthcare Companion</title>
    <meta name="description" content="Your intelligent healthcare companion powered by advanced AI. Get instant medical advice, symptoms analysis, and health recommendations." />
    <link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mediai-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
